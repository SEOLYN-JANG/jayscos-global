<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | JAYSCOS Global Site</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=7">
</head>
<body>
<div id="login" class="login">
  <form id="lf" class="lbox">
    <img src="../img/logo.png" alt="JAYSCOS logo" height="24">
    <h1>Site administration</h1>
    <p>Sign in to manage products, company information and inquiries settings.</p>
    <label><span>Password</span><input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="b pri" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
    <a class="back" href="../index.html">← Back to website</a>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="../img/logo_white.png" alt="JAYSCOS logo" height="18"><span>Admin</span></div>
    <nav id="menu">
      <a data-v="dash" class="on"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Dashboard</a>
      <a data-v="products"><svg viewBox="0 0 24 24"><path d="M9 3h6v4H9zM7 7h10l1 14H6z"/></svg>Products</a>
      <a data-v="company"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16M9 21v-5h6v5M8 9h2M14 9h2M8 13h2M14 13h2"/></svg>Company</a>
      <a data-v="pages"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>Page content</a>
      <a data-v="contact"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg>Contact form</a>
      <a data-v="publish"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg>Publish & settings</a>
    </nav>
    <div class="side-ft">
      <a href="../index.html" target="_blank" rel="noopener">View live site ↗</a>
      <a id="logout">Sign out</a>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="mb" id="mb" aria-label="Menu">☰</button>
      <h2 id="vt">Dashboard</h2>
      <div class="top-r"><label class="lang-pick" title="Content language you are editing"><span>Content</span><select id="alang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label><span id="dirty" class="pill" hidden>Unpublished changes</span><a class="b" id="pv" target="_blank" rel="noopener">Preview draft ↗</a><button class="b pri" id="pubTop">Publish</button></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="admin-i18n.js?v=1"></script>
<script src="admin.js?v=7"></script>
</body>
</html>
